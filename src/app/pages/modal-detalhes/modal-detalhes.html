@if(statusModal()) {
  <section class="container {{ esconderScroll() }}">
    <div class="card">
      <img class="imagem" src="{{ livro.thumbnail ?? 'assets/imagens/capa-indisponivel.png'
      }}" alt="Capa do livro">
      <div class="info-card">
        <p class="titulo">{{ livro.title }}</p>
        <p class="informacoes"><strong>Autoria:</strong> {{ livro.authors ?? '---' }}</p>
        <p class="informacoes"><strong>Publicação:</strong> {{ livro.publishedDate ?? '---' }}</p>
        <p class="informacoes"><strong>Editora:</strong> {{ livro.publisher ?? '---' }}</p>
        <button (click)="lerPrevia()" class="detalhes">Ler prévia</button>
      </div>
        <button (click)="fecharModal()" class="botao-fechar">X</button>
      <div class="sinopse">
        <h4 class="informacoes">Sinopse</h4>
        <p class="resultado">{{ livro.description }}</p>
      </div>
    </div>
    <div class="overlay"></div>
  </section>
}
